on:
  push:
    tags:
      - 'v*'

name: publish first-plugin archetype

jobs:
  publish:
    name: publish Maven central warehouse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'adopt'
          cache: maven
          server-id: sermant
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Install secret key
        run: |
          cat <(echo -e "${{ secrets.GPG_PRIVATE_KEY }}") | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
      - name: create first-plugin archetype
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          mvn archetype:create-from-project -Darchetype.properties=./archetype.properties
          cd ${{ github.workspace }}/target/generated-sources/archetype
          sed -i '/<\/build>/ i \
              <plugins>\n\
                <plugin>\n\
                  <groupId>org.apache.maven.plugins</groupId>\n\
                  <artifactId>maven-gpg-plugin</artifactId>\n\
                  <version>3.0.1</version>\n\
                  <executions>\n\
                    <execution>\n\
                      <id>sign-artifacts</id>\n\
                      <phase>verify</phase>\n\
                      <goals>\n\
                        <goal>sign</goal>\n\
                      </goals>\n\
                    </execution>\n\
                  </executions>\n\
                </plugin>\n\
                <plugin>\n\
                  <groupId>org.sonatype.central</groupId>\n\
                  <artifactId>central-publishing-maven-plugin</artifactId>\n\
                  <version>0.5.0</version>\n\
                  <extensions>true</extensions>\n\
                  <configuration>\n\
                    <publishingServerId>sermant</publishingServerId>\n\
                    <autoPublish>false</autoPublish>\n\
                  </configuration>\n\
                </plugin>\n\
              </plugins>' pom.xml
          cat pom.xml
      - name: Delopy
        run: |
          mvn --batch-mode -Dgpg.passphrase=${{ secrets.GPG_SECRET_KEY_PASSWORD }} deploy -DskipTests
